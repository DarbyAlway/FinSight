name: finsight-prod

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # compose-internal hosts (override anything stale in .env)
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      DATABASE_URL: postgresql://finsight:${POSTGRES_PASSWORD}@postgres:5432/finsight
      CACHE_DB_PATH: /data/cache.db
      SESSION_COOKIE_SECURE: "1"
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_started
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - model_cache:/root/.cache
      - duckdb_cache:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s   # first boot downloads models

  tailscale:
    image: tailscale/tailscale:latest
    hostname: finsight-box
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_EXTRA_ARGS: "--accept-routes"
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: finsight
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - finsight_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsight"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://tailscale:8000
    depends_on:
      - app

volumes:
  finsight_pg:
  qdrant_data:
  model_cache:
  duckdb_cache:
  tailscale_state:
